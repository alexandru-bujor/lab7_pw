services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: megamobile-api-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist uploads directory
      - ./uploads:/app/uploads
    env_file:
      - .env.production
    environment:
      # Override DB_HOST to access MySQL service on host
      - DB_HOST=host.docker.internal
      # Override PORT to match container's exposed port
      - PORT=8080
      # Production mode
      - GIN_MODE=release
      # CORS origins for production
      - CORS_ORIGINS=https://megamobile.md,https://www.megamobile.md
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - megamobile-network

networks:
  megamobile-network:
    driver: bridge
