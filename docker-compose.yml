services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: megamobile-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Exclude build artifacts
      - /app/tmp
      - /app/build
      - /app/.git
    env_file:
      - .env
    environment:
      # Override DB_HOST for Docker to access host machine's XAMPP
      - DB_HOST=host.docker.internal
      # Override PORT to match container's exposed port
      - PORT=8080
      # Override GIN_MODE for development
      - GIN_MODE=debug

      # Database Configuration (Remote MySQL)
      # - DB_USER=app_user
      # - DB_PASS=ChaithuGhiera5koo5eejoxam3
      # - DB_HOST=167.86.114.109
      # - DB_PORT=3306
      # - DB_NAME=app_db

networks:
  megamobile-network:
    driver: bridge
